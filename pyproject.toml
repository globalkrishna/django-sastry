[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-sastry"
version = "1.0.0"
description = "A lightweight zero-config dynamic CRUD admin interface and interactive visual Entity Relations (ER) diagram for Django."
readme = "README.md"
authors = [
    { name = "Krishnamurthy", email = "krishna@globalmultimedia.in" }
]
license = { text = "MIT" }
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["django", "admin", "crud", "entity-relationship", "er-diagram", "schema", "database", "orm"]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[project.urls]
Homepage = "https://github.com/globalkrishna/django-sastry"
Repository = "https://github.com/globalkrishna/django-sastry.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["sastry*"]

[tool.setuptools.package-data]
sastry = [
    "static/**/*",
    "jinja2/**/*",
    "templates/**/*",
]

